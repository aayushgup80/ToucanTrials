<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToucanTrials - Lobby</title>
<link rel="stylesheet" href="css/lobby.css">
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="margin:0;overflow:hidden;background:#07150f">
<canvas id="lobbyCanvas"></canvas>
<div id="lobbyUI">
    <div class="lobby-top">
        <div>
            <div class="lobby-logo">TOUCANTRIALS</div>
            <div class="lobby-status">3D CANOPY LOBBY · <span id="playerName">LOADING...</span></div>
        </div>
        <div style="display:flex;gap:8px;pointer-events:auto">
            <button class="lobby-btn" style="min-width:auto;padding:10px 14px" id="logoutButton">LOGOUT</button>
        </div>
    </div>

    <div class="lobby-card lobby-panel" id="avatarPanel">
        <button class="lobby-close" onclick="closeAvatarPanel()">×</button>
        <div class="lobby-status">AVATAR</div>
        <h2 id="avatarTitle">PLAYER</h2>
        <p id="avatarSubtitle">Canopy Runner</p>
        <p id="avatarDescription">A challenger of the ToucanTrials.</p>
    </div>

    <div class="lobby-card lobby-panel" id="leaderboardPanel">
        <button class="lobby-close" id="closeLeaderboard">×</button>
        <div class="lobby-status">GLOBAL</div>
        <h2>LEADERBOARDS</h2>
        <p>Fastest Level 1 runs.</p>
        <div id="leaderboardList" style="margin-top:14px"></div>
    </div>

    <div class="lobby-card lobby-panel" id="statsPanel">
        <button class="lobby-close" id="closeStats">×</button>
        <div class="lobby-status">PLAYER DATA</div>
        <h2>STATS</h2>
        <p>Runner: <b id="statsName">—</b></p>
        <p>Best Time: <b id="statsBest" style="color:#34d399">—</b></p>
        <div class="coin-pill">🪙 <span id="statsCoins">0</span> coins</div>
    </div>

    <div class="lobby-menu">
        <button class="lobby-btn" id="leaderboardButton">LEADERBOARDS</button>
        <button class="lobby-btn primary" id="playButton">▶ PLAY</button>
        <button class="lobby-btn" id="statsButton">STATS</button>
    </div>
    <div class="lobby-hint">Click an avatar to inspect them · The yellow runner is you</div>
</div>
<script src="js/supabase/client.js"></script>
<script src="js/supabase/auth.js"></script>
<script src="js/supabase/scores.js"></script>
<script src="js/lobby.js"></script>
</body>
</html>
